; Peiskos Lantern firmware. Build and flash with PlatformIO:
;   pio run -e c3 -t upload        (ESP32-C3 SuperMini, the board in the build guide)
;   pio run -e esp32 -t upload     (a classic ESP32 DevKit)
; LED_PIN and LED_COUNT match the build guide; change them here if you wired it differently.

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@2.0.17
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit NeoPixel@1.12.3

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=4
  -DLED_COUNT=12
  -DBUTTON_PIN=9

[env:esp32]
board = esp32dev
build_flags =
  -DLED_PIN=13
  -DLED_COUNT=12
  -DBUTTON_PIN=0

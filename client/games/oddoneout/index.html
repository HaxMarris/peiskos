<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The desktop app opens this from its own files, with no security headers; in a browser the server's apply too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Odd One Out</title>
<link rel="stylesheet" href="../shared/game.css">
<link rel="stylesheet" href="../shared/party.css">
<style>
  /* Your word is a slip of paper held close: the one light thing on the panel. */
  .slip { align-self: center; text-align: center; background: #f6ead9; color: #2a1f18; border-radius: 6px 14px 8px 12px; padding: 10px 28px 14px; transform: rotate(-1.2deg);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45); max-width: 100%; }
  .slip small { display: block; font-size: 12px; color: #6d5a49; }
  .slip strong { display: block; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; overflow-wrap: anywhere; }
  .slip.pair { transform: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; align-self: stretch; }
  .slip.pair strong { font-size: 24px; }
  .slip.pair div + div { border-left: 1px dashed #b9a48d; padding-left: 22px; }
  .seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .seat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; padding: 9px 14px; min-height: 48px;
    border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); }
  .seat .who { font-weight: 800; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .clues { grid-column: 1; font-family: 'Fraunces', Georgia, serif; font-size: 18px; color: var(--glow); overflow-wrap: anywhere; }
  .seat .clues.none { font-family: inherit; font-size: 13px; color: var(--muted); }
  .seat .side { grid-column: 2; grid-row: 1 / span 2; font-size: 13px; color: var(--muted); text-align: right; max-width: 16ch; }
  .seat.turn { border-color: var(--ember); }
  .seat.mine { border-color: var(--ember); background: rgba(240, 138, 75, .18); }
  .seat.odd { border-color: var(--glow); background: rgba(255, 196, 107, .14); }
  .seat.odd .side { color: var(--glow); font-weight: 800; }
  button.seat:disabled { opacity: 1; }
  @media (hover: hover) { button.seat:hover:not(:disabled) { border-color: var(--ember); } }
  @media (max-width: 520px) { .slip strong { font-size: 25px; } .slip.pair { grid-template-columns: 1fr; } .slip.pair div + div { border-left: 0; border-top: 1px dashed #b9a48d; padding: 6px 0 0; } }
</style>
</head>
<body>
<div class="screen"><div class="panel wide" id="panel"></div></div>
<div id="say" class="sr-only" role="status"></div>
<script src="../shared/bridge.js"></script>
<script src="../shared/party.js"></script>
<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>

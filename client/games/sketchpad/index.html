<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The desktop app opens this from its own files, with no security headers; in a browser the server's apply too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sketchpad</title>
<link rel="stylesheet" href="../shared/game.css">
<link rel="stylesheet" href="../shared/canvas.css">
<style>
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 8px 10px 10px; gap: 6px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { font-size: 20px; }
  .top .spacer { flex: 1; }
  #who { font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>Sketchpad</h1>
    <span class="muted" id="who"></span>
    <span class="spacer"></span>
    <button class="tool" id="btnSave" type="button">Save picture</button>
    <button class="tool" id="btnLeave" type="button">Leave</button>
  </div>
  <div class="board"><canvas id="page" aria-label="The shared page. Draw with your mouse, pen or finger."></canvas></div>
  <div class="tools" id="tools"></div>
</div>
<script src="../shared/bridge.js"></script>
<script src="../shared/canvas.js"></script>
<script src="game.js"></script>
</body>
</html>

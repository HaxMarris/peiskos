<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The desktop app opens this from its own files, with no security headers; in a browser the server's apply too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fireside Trivia</title>
<link rel="stylesheet" href="../shared/game.css">
<style>
  .panel { gap: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
  #question { font-family: 'Fraunces', Georgia, serif; font-size: 22px; color: var(--strong); line-height: 1.3; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answers.tf { grid-template-columns: 1fr 1fr; }
  .answer { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; min-height: 56px; position: relative; }
  @media (hover: hover) { .answer:hover:not(:disabled) { border-color: var(--ember); } }
  .answer:disabled { opacity: 1; }
  .answer.picked { border-color: var(--ember); background: rgba(240, 138, 75, .18); }
  .answer.right { border-color: var(--good); background: rgba(143, 191, 122, .25); }
  .answer.wrong { border-color: var(--bad); background: rgba(232, 105, 94, .18); }
  .answer .who { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ember); transition: width .25s linear; }
  #gain { min-height: 22px; text-align: center; font-weight: 800; color: var(--glow); }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 10px; max-height: 240px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 12px; }
  .cats label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .cats .n { color: var(--muted); font-size: 12px; }
  .opts { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
  .own { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .own li { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
  .form { display: flex; flex-direction: column; gap: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .credit { font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 520px) { .answers { grid-template-columns: 1fr; } #question { font-size: 19px; } }
</style>
</head>
<body>
<div class="screen"><div class="panel wide" id="panel"></div></div>
<div id="say" class="sr-only" role="status"></div>
<script src="../shared/bridge.js"></script>
<script src="game.js"></script>
</body>
</html>

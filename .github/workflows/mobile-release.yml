# Builds the Android and iPhone apps.
#
# - On every pull request that touches the apps or the web client, both are built to check
#   they still build (the Android test build can be downloaded from the run's page).
# - "Start release" (release.yml) runs it for a draft release, and so does publishing a release
#   on GitHub by hand (tag e.g. v0.7.0): the Android app is attached to the release, signed with
#   Peiskos's own key, and the iPhone app goes to TestFlight and is sent for Apple's review. Each
#   only happens once its secrets are set; see mobile/README.md.
name: Mobile release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - mobile/**
      - client/**
      - .github/workflows/mobile-release.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag, like v0.8.12
        type: string
        required: true
      iphone:
        description: Build the iPhone app and send it to TestFlight
        type: boolean
        default: true
    outputs:
      ios_build_id:
        description: App Store Connect's id for the uploaded build, when it went to TestFlight
        value: ${{ jobs.ios.outputs.build_id }}
      ios_review:
        description: true when the build is waiting on Apple's TestFlight review
        value: ${{ jobs.ios.outputs.review }}

# Read-only by default; only the Android job attaches its app to a release.
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release this build is for, if any: the draft "Start release" made, or one published by hand.
  RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'release' && github.ref_name) || '' }}

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mobile
      - run: npm run copy-client && npx cap sync android
        working-directory: mobile
      # The version comes from the release tag (v0.7.0 -> 0.7.0), and each version gets a bigger
      # number (0.7.0 -> 7000) so phones know it's newer.
      - name: Version
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then v="${RELEASE_TAG#v}"; else v=0.0.0; fi
          IFS=. read -r major minor patch <<< "${v%%-*}"
          code=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( code > 0 ? code : 1 ))" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/peiskos.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/peiskos.keystore"
            [ -n "$ANDROID_KEY_PASSWORD" ] || unset ANDROID_KEY_PASSWORD
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist/Peiskos-$APP_VERSION.apk"
          else
            # No signing key yet: a test build, signed with a throwaway key. It installs, but the
            # next one won't update it, so it isn't attached to releases.
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/Peiskos-$APP_VERSION-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: peiskos-android
          path: mobile/dist/*.apk
          if-no-files-found: error
      - name: Attach to the release
        if: env.RELEASE_TAG != '' && hashFiles('mobile/dist/*-test.apk') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" mobile/dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iPhone app
    # Runs unless "Start release" was told to leave the iPhone out. (Not `inputs.iphone != false`:
    # when nothing passes the input, it's null, which GitHub counts as equal to false.)
    if: inputs.iphone == null || inputs.iphone
    # Apple only takes apps built with Xcode 26 (the iOS 26 SDK) or newer.
    runs-on: macos-26
    # Includes waiting for Apple to process the upload, which can take a while.
    timeout-minutes: 100
    outputs:
      build_id: ${{ steps.submit.outputs.build_id }}
      review: ${{ steps.submit.outputs.review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Xcode version
        run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npm run copy-client && npx cap sync ios
        working-directory: mobile
      # With an App Store Connect key, the app is signed by Apple's cloud signing (no certificates to
      # manage) and sent straight to TestFlight. Without one, it just checks that the app builds.
      - name: Check the App Store Connect key
        id: asc
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY" ]; then echo "No App Store Connect key set, so the iPhone app isn't sent to TestFlight."; exit 0; fi
          # Says which secret looks wrong (never what's in it), then asks Apple whether the key works.
          node .github/scripts/app-store.mjs check
          echo "upload=yes" >> "$GITHUB_OUTPUT"
          # The version people see only changes with the middle number (v0.8.12 -> 0.8), so each
          # patch release is a new build of the same version, which Apple usually lets through
          # TestFlight review in minutes. The build number just has to grow.
          v="${RELEASE_TAG#v}"; v="${v%%-*}"
          echo "version=$(echo "$v" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%y%m%d).$(date -u +%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        working-directory: mobile/ios/App
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ steps.asc.outputs.upload }}" = yes ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$ASC_KEY" | tr -d '\r' > "$key"
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$(echo "$ASC_KEY_ID" | tr -d '[:space:]')" -authenticationKeyIssuerID "$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')")
            team="$(echo "$TEAM_ID" | tr -d '[:space:]')"
            # Built unsigned, then signed for the App Store while exporting: signing while building
            # would want a development profile, which needs a registered iPhone.
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Peiskos.xcarchive" \
              DEVELOPMENT_TEAM="$team" CODE_SIGNING_ALLOWED=NO \
              MARKETING_VERSION="${{ steps.asc.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.asc.outputs.build }}" \
              archive
            cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Peiskos.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO build
          fi
      - name: Send to TestFlight review
        id: submit
        if: steps.asc.outputs.upload == 'yes'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          WHATS_NEW: Peiskos ${{ env.RELEASE_TAG }}
        run: node .github/scripts/app-store.mjs submit "${{ steps.asc.outputs.version }}" "${{ steps.asc.outputs.build }}"

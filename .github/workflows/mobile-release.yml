# Builds the Android and iPhone apps.
#
# - On every pull request that touches the apps or the web client, both are built to check
#   they still build (the Android test build can be downloaded from the run's page).
# - Publish a release on GitHub (tag e.g. v0.7.0) and the Android app is attached to it, signed
#   with Peiskos's own key, and the iPhone app goes to TestFlight. Each only happens once its
#   secrets are set; see mobile/README.md.
name: Mobile release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - mobile/**
      - client/**
      - .github/workflows/mobile-release.yml
  workflow_dispatch:

# Read-only by default; only the Android job attaches its app to a release.
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mobile
      - run: npm run copy-client && npx cap sync android
        working-directory: mobile
      # The version comes from the release tag (v0.7.0 -> 0.7.0), and each version gets a bigger
      # number (0.7.0 -> 7000) so phones know it's newer.
      - name: Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = release ]; then v="${GITHUB_REF_NAME#v}"; else v=0.0.0; fi
          IFS=. read -r major minor patch <<< "${v%%-*}"
          code=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( code > 0 ? code : 1 ))" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/peiskos.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/peiskos.keystore"
            [ -n "$ANDROID_KEY_PASSWORD" ] || unset ANDROID_KEY_PASSWORD
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist/Peiskos-$APP_VERSION.apk"
          else
            # No signing key yet: a test build, signed with a throwaway key. It installs, but the
            # next one won't update it, so it isn't attached to releases.
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/Peiskos-$APP_VERSION-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: peiskos-android
          path: mobile/dist/*.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' && hashFiles('mobile/dist/*-test.apk') == ''
        with:
          files: mobile/dist/*.apk

  ios:
    name: iPhone app
    # Apple only takes apps built with Xcode 26 (the iOS 26 SDK) or newer.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Xcode version
        run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npm run copy-client && npx cap sync ios
        working-directory: mobile
      # With an App Store Connect key, the app is signed by Apple's cloud signing (no certificates to
      # manage) and sent straight to TestFlight. Without one, it just checks that the app builds.
      - name: Check the App Store Connect key
        id: asc
        if: github.event_name == 'release'
        shell: bash
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY" ]; then echo "No App Store Connect key set, so the iPhone app isn't sent to TestFlight."; exit 0; fi
          # Says which secret looks wrong (never what's in it), then asks Apple whether the key works.
          node - <<'EOF'
          const crypto = require('node:crypto');
          const { ASC_KEY: key, ASC_KEY_ID: id, ASC_ISSUER_ID: issuer, TEAM_ID: team } = process.env;
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
          const pem = key.trim().replace(/\r/g, '');
          if (!/^-----BEGIN PRIVATE KEY-----\n[\s\S]+\n-----END PRIVATE KEY-----$/.test(pem))
            fail('APP_STORE_CONNECT_KEY should be the whole .p8 file, including the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines.');
          if (!/^[A-Z0-9]{10}$/.test((id ?? '').trim())) fail('APP_STORE_CONNECT_KEY_ID should be the 10-character Key ID (letters and digits), like 2X9R4HXF34.');
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test((issuer ?? '').trim())) fail('APP_STORE_CONNECT_ISSUER_ID should be the Issuer ID shown above the keys list, like 57246542-96fe-1a63-e053-0824d011072a.');
          if (!/^[A-Z0-9]{10}$/.test((team ?? '').trim())) fail('APPLE_TEAM_ID should be the 10-character Team ID from Membership details.');
          let privateKey;
          try { privateKey = crypto.createPrivateKey(pem); } catch { fail("APP_STORE_CONNECT_KEY isn't a readable .p8 key. Copy the whole file again from Notepad."); }
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = `${b64({ alg: 'ES256', kid: id.trim(), typ: 'JWT' })}.${b64({ iss: issuer.trim(), iat: now, exp: now + 600, aud: 'appstoreconnect-v1' })}`;
          const jwt = `${head}.${crypto.sign('sha256', Buffer.from(head), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;
          fetch('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=app.peiskos', { headers: { authorization: `Bearer ${jwt}` } }).then(async (r) => {
            if (r.status === 401) fail("Apple turned the key down (401). Check that APP_STORE_CONNECT_KEY_ID and APP_STORE_CONNECT_ISSUER_ID belong to this .p8 file, and that it's a Team key (not an Individual key) that hasn't been revoked.");
            if (r.status === 403) fail('Apple says the key may not do this (403). Make it a Team key with Admin access, and accept any new agreements in App Store Connect.');
            if (!r.ok) fail(`App Store Connect answered ${r.status}. Try the release again in a while.`);
            const { data } = await r.json();
            if (!data.length) fail('The key works, but App Store Connect has no app with the bundle ID app.peiskos yet. Create it (Apps, +, New App) first.');
            console.log(`The key works, and App Store Connect has ${data[0].attributes.name}.`);
          });
          EOF
          echo "upload=yes" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        working-directory: mobile/ios/App
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ steps.asc.outputs.upload }}" = yes ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$ASC_KEY" | tr -d '\r' > "$key"
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$(echo "$ASC_KEY_ID" | tr -d '[:space:]')" -authenticationKeyIssuerID "$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')")
            team="$(echo "$TEAM_ID" | tr -d '[:space:]')"
            version="${GITHUB_REF_NAME#v}"
            # Built unsigned, then signed for the App Store while exporting: signing while building
            # would want a development profile, which needs a registered iPhone.
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Peiskos.xcarchive" \
              DEVELOPMENT_TEAM="$team" CODE_SIGNING_ALLOWED=NO \
              MARKETING_VERSION="${version%%-*}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              archive
            cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Peiskos.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO build
          fi

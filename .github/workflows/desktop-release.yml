# Builds the desktop app for Windows, macOS and Linux.
#
# - "Start release" (release.yml) runs it for a draft release, which is published once everything
#   is ready. Publishing a release on GitHub by hand (Releases > Draft a new release, tag e.g.
#   v0.1.0) still works too. Either way the installers are attached to the release.
# - Or run it by hand from the Actions tab to get test builds as downloadable artifacts.
name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag, like v0.8.12
        type: string
        required: true

permissions:
  contents: write

env:
  # The release this build is for, if any: the draft "Start release" made, or one published by hand.
  RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'release' && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: desktop
      # The app's version comes from the release tag (v0.2.0 -> 0.2.0), so the
      # built-in updater can tell which release is newer. A typo'd tag (v8.0.0 for
      # v0.8.0) would put a far higher version on everyone who installs it, and they'd
      # never see an update again, so the tag must be vX.Y.Z with the same major
      # number as package.json (bump it there on purpose when going to 1.0).
      - if: env.RELEASE_TAG != ''
        name: Check the release tag
        shell: bash
        working-directory: desktop
        run: |
          tag="$RELEASE_TAG"
          major="$(node -p "require('./package.json').version.split('.')[0]")"
          if ! [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' isn't like v$major.1.2. Delete this release and its tag, then publish it again with a vX.Y.Z tag."
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$major" ]; then
            echo "::error::Release tag '$tag' starts with v${BASH_REMATCH[1]} but the app is on v$major.x. Delete this release and its tag, then publish it again with a v$major.x.y tag. If this jump is meant, change the version in desktop/package.json first."
            exit 1
          fi
      - if: env.RELEASE_TAG != ''
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
        shell: bash
        working-directory: desktop
      # Signing is optional: with no secrets set, the apps are built unsigned as before.
      # Mac: an Apple Developer ID certificate (CSC_LINK as base64 .p12 + CSC_KEY_PASSWORD) signs
      # it, and APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID notarize it, so it opens with
      # no warning and updates itself. Windows: Azure Artifact Signing (AZURE_* secrets), or a
      # certificate file (WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD). See "Signing the desktop app" in the README.
      - name: Build
        shell: bash
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          # Empty secrets would read as "sign with nothing", so leave them out entirely.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          extra=()
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            extra=(
              -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
              -c.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME"
            )
          fi
          npm run dist -- --publish never "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
      # latest*.yml and .blockmap files are what installed apps read to update themselves.
      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" desktop/dist/*.exe desktop/dist/*.dmg desktop/dist/*.zip desktop/dist/*.AppImage \
            desktop/dist/latest*.yml desktop/dist/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"
